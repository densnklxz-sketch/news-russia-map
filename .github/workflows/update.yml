name: Обновление карты

on:
  schedule:
    - cron: "*/10 * * * *"     # каждые 10 минут (GitHub может задерживать запуск на несколько минут)
  workflow_dispatch:           # кнопка «Run workflow» для ручного запуска
    inputs:
      check_only:
        description: "Только проверить бота и права в канале, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser==6.0.11 requests==2.32.3

      # База записей хранится в кэше GitHub между запусками
      - name: Восстановить базу
        uses: actions/cache/restore@v4
        with:
          path: incidents.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: "Первый запуск: загрузить демо-записи"
        run: |
          if [ ! -f incidents.db ]; then python seed_demo.py; fi

      - name: Собрать новые происшествия из лент
        env:
          DB_PATH: incidents.db
          USER_AGENT: "incident-map-collector/1.0 (https://github.com/${{ github.repository }})"
          WORKER_URL: ${{ secrets.WORKER_URL }}   # для новостей из предложки (опубликованные администратором)
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: python collector.py

      - name: Публикация в канал
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@nrmpnews"
          DB_PATH: incidents.db
          MAX_POSTS: "1"
          MIN_GAP_MIN: "25"
          POST_HOURS: "8-23"
          CHECK_ONLY: ${{ inputs.check_only && '1' || '' }}
          # Дополнительные публикации (можно менять или отключить, поставив -1):
          WEEKLY_HOUR: "20"          # итоги недели по воскресеньям, час по Москве
          POLL_HOUR: "19"            # опрос раз в сутки
          REGION_DIGESTS: ""         # например: "Москва,Санкт-Петербург" — сводки «регион за сутки»
          REGION_DIGEST_HOUR: "20"
          PIN_INTRO: "1"             # один раз опубликовать и закрепить приветственный пост
        run: python post_channel.py

      - name: Подписки и уведомления
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DB_PATH: incidents.db
          MAX_PER_USER: "5"
          WORKER_URL: ${{ secrets.WORKER_URL }}   # необязательно: Cloudflare Worker для мгновенных ответов бота
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: python notify_bot.py

      - name: Сохранить базу
        uses: actions/cache/save@v4
        with:
          path: incidents.db
          key: db-${{ github.run_id }}

      - name: Охват по регионам (на странице запуска, в блоке Summary)
        continue-on-error: true
        env:
          DB_PATH: incidents.db
        run: python coverage.py

      - name: Собрать страницу
        env:
          DB_PATH: incidents.db
          SITE_OUT: site/index.html
          SITE_URL: "https://news-russia-map.ru/"
          YMAPS_KEY: ${{ vars.YMAPS_KEY }}
        run: python build_site.py

      # Копия сайта в Yandex Object Storage (бакет news-russia-map.ru): для посетителей из России.
      # Работает, только когда в Settings → Secrets заданы YC_S3_KEY_ID и YC_S3_SECRET (статический ключ сервисного аккаунта).
      - name: Копия сайта в Яндекс Облако
        continue-on-error: true
        env:
          YC_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_SECRET: ${{ secrets.YC_S3_SECRET }}
        run: |
          if [ -z "$YC_KEY_ID" ]; then echo "::warning title=Яндекс Облако::ключ не задан (секреты YC_S3_KEY_ID и YC_S3_SECRET), копия пропущена"; exit 0; fi
          KEY=$(printf %s "$YC_KEY_ID" | tr -d '[:space:]"'); SECRET=$(printf %s "$YC_SECRET" | tr -d '[:space:]"')
          # Простая загрузка через curl с подписью AWS SigV4 (aws cli новых версий не совместим с Object Storage)
          fail=""
          for f in site/*; do
            name=$(basename "$f")
            case "$name" in *.html) type="text/html; charset=utf-8";; *.xml) type="application/xml";; *.txt) type="text/plain; charset=utf-8";; *) type="application/octet-stream";; esac
            code=$(curl -sS -o /tmp/yc_resp.txt -w "%{http_code}" --aws-sigv4 "aws:amz:ru-central1:s3" --user "$KEY:$SECRET" \
              -H "Content-Type: $type" -H "Cache-Control: max-age=60" \
              -T "$f" "https://storage.yandexcloud.net/news-russia-map.ru/$name") || code="curl-error"
            [ "$code" = "200" ] || fail="$fail $name:$code $(head -c 200 /tmp/yc_resp.txt | tr '\n' ' ')"
          done
          if [ -z "$fail" ]; then
            echo "::notice title=Яндекс Облако::сайт скопирован"
          else
            echo "::warning title=Яндекс Облако::копия не удалась:$fail"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
