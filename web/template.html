  function makeYmaps(){
    var RU=[[42,27],[68,170]], autoRU=true;
    var map=new ymaps.Map("map",{bounds:RU,controls:[]},{minZoom:2,maxZoom:18,yandexMapDisablePoiInteractivity:true,avoidFractionalZoom:true});

    try{ new ResizeObserver(function(){ map.container.fitToViewport(); if(autoRU) map.setBounds(RU); }).observe($("map")); }catch(e){}
    var layouts={};
    function pinLayout(type,precise){
      var k=type+(precise?"":"~");
      if(!layouts[k]){var t=TYPES[type]||TYPES.tech;
        layouts[k]=ymaps.templateLayoutFactory.createClass('<div class="pin'+(precise?"":" approx")+'" style="--c:'+t.c+';transform:translate(-15px,-15px)">'+t.e+'</div>');}

      clusterIconLayout:ymaps.templateLayoutFactory.createClass('<div class="clus" style="transform:translate(-18px,-18px)">{{ properties.geoObjects.length }}</div>'),
      clusterIconShape:{type:"Circle",coordinates:[0,0],radius:18},
      gridSize:80,groupByCoordinates:false,clusterHasBalloon:false,clusterHasHint:false,clusterDisableClickZoom:false,maxZoom:16
    });
    map.geoObjects.add(cluster);
    map.events.add("click",hideSheet);
    var me=null;
    function ground(){try{return map.panes.get("ground").getElement();}catch(e){return null;}}
    function theme(){
      var g=ground(); if(g)g.style.filter=isDark()?"invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.7)":"";
      $("map").style.background=isDark()?"#1c1b19":"#e8e6e0";
    }
    return {
      name:"yandex", noHeat:true,
      setPins:function(list){
        cluster.removeAll();
        var pos=spread(list);
        cluster.add(list.map(function(i){
          var pm=new ymaps.Placemark(pos[i.id],{},{iconLayout:pinLayout(i.type,i.precise),iconShape:{type:"Circle",coordinates:[0,0],radius:15},hasBalloon:false,hasHint:false});
          pm.events.add("click",function(e){e.stopPropagation&&e.stopPropagation(); showSheet(i,true);});
          return pm;
        }));
      },
      me:function(p){
        if(me){map.geoObjects.remove(me);me=null;}
        if(p){me=new ymaps.Placemark(p,{},{preset:"islands#blueCircleDotIcon"}); map.geoObjects.add(me);}
      },
      fit:function(list){

      },
      goTo:function(i){autoRU=false; map.setCenter([i.lat,i.lon],Math.max(map.getZoom(),9),{duration:300});},
      pan:function(i){
        var z=map.getZoom(), pr=map.options.get("projection"), g=pr.toGlobalPixels([i.lat,i.lon],z), c=map.getGlobalPixelCenter(), h=map.container.getSize()[1];
        var y=g[1]-c[1]+h/2; if(y>h-210) map.setGlobalPixelCenter([c[0],c[1]+(y-(h-250))],z,{duration:200});
      },
      theme:theme,
      zoom:function(d){map.setZoom(Math.max(2,Math.min(18,map.getZoom()+(d>0?1:-1))),{duration:200});},
      resize:function(){map.container.fitToViewport(); if(autoRU) map.setBounds(RU);}
    };
  }

  function makeLeaflet(){
    var map=L.map("map",{zoomControl:false,doubleClickZoom:false,minZoom:2,maxZoom:18,worldCopyJump:false,preferCanvas:true,markerZoomAnimation:false,fadeAnimation:false,zoomSnap:1});
    /* зум одним пальцем, как в Яндекс Картах: двойной тап и, не отпуская, вести вверх/вниз */
    (function(){

        if(e.touches.length!==1){ on=false; return; }

          on=true; sy=t.clientY; sz=map.getZoom(); pt=map.mouseEventToContainerPoint({clientX:t.clientX,clientY:t.clientY});
          map.dragging.disable(); e.preventDefault(); e.stopImmediatePropagation(); last=0; return;

        if(!on) return;

        if(z!==map.getZoom()) map.setZoomAround(pt,z,{animate:false});

      function end(){ if(on){ on=false; map.dragging.enable(); } }

    })();

    var RU=[[42,27],[68,170]], autoRU=true;
    map.fitBounds(RU,{animate:false});
    try{ new ResizeObserver(function(){ map.invalidateSize(); if(autoRU) map.fitBounds(RU,{animate:false}); }).observe(map.getContainer()); }catch(e){}
    ["mousedown","touchstart","wheel"].forEach(function(n){map.getContainer().addEventListener(n,function(){autoRU=false;},{passive:true,capture:true});});

    var tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,maxNativeZoom:18,attribution:"© OpenStreetMap",updateWhenIdle:false,updateWhenZooming:false,updateInterval:80,keepBuffer:5,crossOrigin:true}).addTo(map);

      showCoverageOnHover:false,disableClusteringAtZoom:1,maxClusterRadius:55,animate:false,animateAddingMarkers:false,chunkedLoading:true,removeOutsideVisibleBounds:true,
      iconCreateFunction:function(c){return L.divIcon({html:'<div class="clus">'+c.getChildCount()+'</div>',className:"",iconSize:[36,36]});}
    });
    map.addLayer(cluster);
    var heatL=null, meL=null;
    map.on("click",hideSheet);

    return {
      name:"leaflet",
      setPins:function(list){
        cluster.clearLayers();
        var pos=spread(list);
        cluster.addLayers(list.map(function(i){
          var t=TYPES[i.type]||TYPES.tech;
          var icon=L.divIcon({className:"",html:'<div class="pin'+(i.precise?"":" approx")+'" style="--c:'+t.c+'">'+t.e+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
          var m=L.marker(pos[i.id],{icon:icon,keyboard:false,riseOnHover:false});
          m.on("click",function(){showSheet(i,true);});

        }));
      },
      me:function(p){
        if(meL){map.removeLayer(meL);meL=null;}
        if(p)meL=L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#2A76CF",fillOpacity:1}).addTo(map);
      },
      heat:function(on,list){
        if(heatL){map.removeLayer(heatL);heatL=null;}
        if(on&&L.heatLayer){ map.removeLayer(cluster); heatL=L.heatLayer(list.map(function(i){return [i.lat,i.lon,.7];}),{radius:24,blur:20,maxZoom:9}).addTo(map); }

      fit:function(list){

      },
      goTo:function(i){autoRU=false; map.setView([i.lat,i.lon],Math.max(map.getZoom(),9),{animate:true,duration:.3});},
      pan:function(i){var p=map.latLngToContainerPoint([i.lat,i.lon]), h=map.getSize().y; if(p.y>h-210)map.panBy([0,p.y-(h-250)]);},
      theme:function(){setTiles();},
      zoom:function(d){if(d>0)map.zoomIn();else map.zoomOut();},
      resize:function(){map.invalidateSize(); if(autoRU) map.fitBounds(RU,{animate:false});}
    };
  }

      box.appendChild(mb);
    }
    if(sheetId&&!byId[sheetId]) hideSheet();
    badge();
  }
  function shareItem(i){
    var link="https://t.me/"+BOT+"/NewsRussiaMap?startapp="+crc32(i.url||"")+"&mode=fullscreen";
    var u="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(i.title||"");
    if(tg&&tg.openTelegramLink)tg.openTelegramLink(u); else window.open(u,"_blank");
  }
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-share]"); if(b&&byId[b.getAttribute("data-share")])shareItem(byId[b.getAttribute("data-share")]);});
  function pressed(el,v){el.setAttribute("aria-pressed",v?"true":"false");}
  $("hurtbtn").onclick=function(){hurtOn=!hurtOn;pressed(this,hurtOn);feedLimit=60;render();};
  $("heatbtn").onclick=function(){heatOn=!heatOn;pressed(this,heatOn);render();};
  $("nearbtn").onclick=function(){
    var b=this;
    if(nearPos){nearPos=null;pressed(b,false);if(eng&&eng.me)eng.me(null);feedLimit=60;render(true);return;}
    if(!navigator.geolocation){return;}
    navigator.geolocation.getCurrentPosition(function(p){
      nearPos=[p.coords.latitude,p.coords.longitude]; pressed(b,true); feedLimit=60; render();
      if(eng){try{if(eng.me)eng.me(nearPos); eng.goTo({lat:nearPos[0],lon:nearPos[1]});}catch(e){}}
    },function(){ var m="Не удалось определить местоположение. Разрешите доступ к геопозиции."; if(tg&&tg.showAlert)tg.showAlert(m); },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
  };
  function setRegion(r){var sel=$("region"),ok=false;for(var n=0;n<sel.options.length;n++){if(sel.options[n].value===r)ok=true;} if(!ok&&r)return; sel.value=r; store("nm_viewreg",r); feedLimit=60; render(true); markQuick();}
  function markQuick(){var r=$("region").value; Array.prototype.forEach.call(document.querySelectorAll("#quick [data-reg]"),function(b){pressed(b,b.getAttribute("data-reg")===r);});}
  $("quick").addEventListener("click",function(e){var b=e.target.closest("[data-reg]"); if(!b)return; var r=b.getAttribute("data-reg"); setRegion($("region").value===r?"":r);});
  $("feedlist").addEventListener("click",function(e){
    var b=e.target.closest("[data-show]"); if(!b)return;
    var i=byId[b.getAttribute("data-show")]; if(!onMap(i)){setTab("feed");return;} setTab("map");
    setTimeout(function(){goTo(i);showSheet(i,false);},60);
  });

  /* карточка на карте */
  var sheetId=null;
  function showSheet(i,pan){
    sheetId=i.id; var s=$("sheet");
    s.innerHTML=(i.img&&/^https:\/\//.test(i.img)?'<div class="thumb"><img data-pic="1" referrerpolicy="no-referrer" alt="" src="'+esc(i.img)+'"></div>':'')+
      '<div class="txt">'+tag(i)+'<h3>'+esc(i.title)+'</h3><div class="place">'+esc(i.place)+' · '+esc(when(i))+'</div>'+
      '<div class="acts"><button class="btn" type="button" data-share="'+i.id+'">Поделиться</button><a class="btn" data-ext="1" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(i.url))+'">'+(i.vid?'🎥 Видео · ':'')+esc(i.source)+' ↗</a></div></div>'+
      '<button class="x" type="button" aria-label="Закрыть" id="sx">×</button>';
    s.hidden=false; $("view-map").classList.add("sheetopen"); $("sx").onclick=hideSheet;
    if(pan&&eng){try{eng.pan(i);}catch(e){}}
  }
  function hideSheet(){sheetId=null;$("sheet").hidden=true;$("view-map").classList.remove("sheetopen");}

  /* уведомления */
  var sub={region:store("nm_region")||"",types:{}};
  try{sub.types=JSON.parse(store("nm_types")||"{}");}catch(e){sub.types={};}
  Object.keys(TYPES).forEach(function(k){if(sub.types[k]===undefined)sub.types[k]=true;});
  var lastSeen=+store("nm_seen")||0;
  function matches(i){return (!sub.region||i.region===sub.region)&&sub.types[i.type];}
  function fresh(){var since=lastSeen||Date.now()/1000-86400; return DATA.filter(function(i){return i.ts>since&&matches(i);});}
  function badge(){var n=tab==="notify"?0:fresh().length, b=$("badge"); b.hidden=!n; b.textContent=n>9?"9+":n;}

  function renderNotify(){
    var box=$("notifyscroll"), items=fresh();
    box.innerHTML=
      '<div class="panel"><h2>Уведомления о новых происшествиях</h2>'+
      '<p>Выберите регион и типы событий, затем подпишитесь в чате с ботом: он будет присылать новые происшествия сообщениями.</p>'+
      '<div class="lab">Регион</div><select id="subRegion" aria-label="Регион для уведомлений"><option value="">Вся Россия</option>'+
      regionList.map(function(r){return '<option value="'+esc(r)+'"'+(r===sub.region?" selected":"")+'>'+esc(r)+'</option>';}).join("")+'</select>'+
      '<div class="lab">Что интересует</div><div class="chips" id="subTypes" style="flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0"></div>'+
      '<button class="btn primary" type="button" id="subgo">Подписаться в Telegram</button><div id="subnote" role="status"></div>'+
      '<p style="font-size:12px">Нажмите «Start» в чате с ботом. Подтверждение придёт в течение 10–15 минут, дальше бот присылает до 5 новых происшествий за раз. Отписаться: команда /stop в чате с ботом. Канал с новостями: <a data-ext="1" target="_blank" rel="noopener noreferrer" href="https://t.me/nrmpnews" style="color:var(--accent)">t.me/nrmpnews</a></p></div>'+
      '<div class="panel"><h2>Новое с вашего прошлого визита</h2><div id="newlist"></div>'+
      '<p style="font-size:11px;opacity:.7">Версия страницы: '+esc(BUILD)+'</p></div>';
    var st=$("subTypes");
    Object.keys(TYPES).forEach(function(k){
      var b=document.createElement("button"); b.className="chip"; b.type="button"; b.style.setProperty("--c",TYPES[k].c); b.setAttribute("aria-pressed",!!sub.types[k]);
      b.innerHTML='<i></i>'+TYPES[k].e+' '+esc(TYPES[k].name);
      b.onclick=function(){sub.types[k]=!sub.types[k]; b.setAttribute("aria-pressed",!!sub.types[k]); store("nm_types",JSON.stringify(sub.types)); fillNew();};
      st.appendChild(b);
    });
    $("subRegion").onchange=function(){sub.region=this.value; store("nm_region",sub.region); fillNew();};
    $("subgo").onclick=function(){
      var mask=0; Object.keys(TYPES).forEach(function(k,n){if(sub.types[k])mask|=1<<n;});
      if(!mask){$("subnote").textContent="Выберите хотя бы один тип событий.";return;}
      $("subnote").textContent="";
      var link="https://t.me/"+BOT+"?start=n"+mask+"_"+(sub.region?crc32(sub.region):"0");
      if(tg&&tg.openTelegramLink)tg.openTelegramLink(link); else window.open(link,"_blank");
    };
    fillNew(items);
  }
  function fillNew(items){
    items=items||fresh(); var box=$("newlist"); if(!box)return;
    if(!items.length){box.innerHTML='<p>Новых происшествий нет.</p>';return;}
    box.innerHTML=items.slice(0,30).map(function(i){var t=TYPES[i.type]||TYPES.tech;
      return '<button class="nrow" type="button" data-show="'+i.id+'" style="--c:'+t.c+'"><span class="d"></span><span><b>'+esc(i.title)+'</b><small>'+esc(i.place)+' · '+esc(ago(i.ts))+'</small></span></button>';}).join("");
  }
  $("notifyscroll").addEventListener("click",function(e){
    var b=e.target.closest("[data-show]"); if(!b)return;
    var i=byId[b.getAttribute("data-show")]; if(!onMap(i)){setTab("feed");return;} setTab("map");
    setTimeout(function(){goTo(i);showSheet(i,false);},60);
  });

  /* вкладки */
  var tab="map";
  function setTab(t){
    tab=t;
    document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===t);});
    ["map","feed","notify"].forEach(function(n){$("view-"+n).classList.toggle("active",n===t);});
    var f=$("filters");
    if(t==="map")$("view-map").appendChild(f);
    else if(t==="feed"){var sc=$("feedscroll"); sc.insertBefore(f,sc.firstChild);}
    f.style.display=t==="notify"?"none":"";
    applyFHidden();
    if(t==="map")setTimeout(function(){if(eng&&eng.resize){try{eng.resize();}catch(e){}}},30);
    if(t==="notify"){renderNotify(); lastSeen=Math.floor(Date.now()/1000); store("nm_seen",String(lastSeen));}
    badge();
  }
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.tab);};});
  window.addEventListener("resize",function(){if(eng&&eng.resize){try{eng.resize();}catch(e){}}});

  $("view-map").appendChild($("filters"));
  (function(){ /* запоминаем регион, выбранный в прошлый раз (если не открыли ссылку на конкретную новость) */
    var deep=/[?&]p=/.test(location.search)||!!(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param);
    var r=store("nm_viewreg")||""; if(deep||!r)return;
    var sel=$("region"); for(var n=0;n<sel.options.length;n++){ if(sel.options[n].value===r){sel.value=r;break;} }
  })();
  markQuick();
  render(); setTab("map");
  loadMap();

  /* ссылка на конкретную новость: ?p=<crc32 ссылки на источник> (на сайте) или startapp=<тот же код> (в мини-приложении) */
  (function(){
    var p=""; try{p=new URLSearchParams(location.search).get("p")||"";}catch(e){}
    if(!p&&tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)p=String(tg.initDataUnsafe.start_param);
    if(!/^[0-9a-f]{1,8}$/.test(p))return;
    var hit=null; for(var n=0;n<DATA.length;n++){ if(crc32(DATA[n].url||"")===p){hit=DATA[n];break;} }
    if(!hit)return;
    if(!onMap(hit)){setTab("feed");return;}
    setTimeout(function(){goTo(hit);showSheet(hit,false);},250);
  })();
})();
</script>
</body>
</html>
