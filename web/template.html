<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<title>Карта происшествий России</title>
<style>
  :root{
    --bg:#EDF1F4; --panel:#FFFFFF; --glass:rgba(255,255,255,.93); --line:#C9D4DD; --fg:#14202B; --muted:#5A6C7C;
    --chip:#E3EAF0; --accent:#D9461F; --on-accent:#fff;
    --dtp:#C9741A; --fire:#CF3B36; --wx:#2A76CF; --crime:#7656C2; --tech:#18907D; --mil:#B03A7A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D141B; --panel:#141D27; --glass:rgba(20,29,39,.93); --line:#2A3A49; --fg:#E6ECF2; --muted:#8EA0B1;
      --chip:#1D2935; --accent:#FF7A4D; --on-accent:#0D141B;
      --dtp:#F0A04B; --fire:#FF6B63; --wx:#5AA3F5; --crime:#A28BEB; --tech:#3FCDB7; --mil:#E37BB5; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D141B; --panel:#141D27; --glass:rgba(20,29,39,.93); --line:#2A3A49; --fg:#E6ECF2; --muted:#8EA0B1;
    --chip:#1D2935; --accent:#FF7A4D; --on-accent:#0D141B;
    --dtp:#F0A04B; --fire:#FF6B63; --wx:#5AA3F5; --crime:#A28BEB; --tech:#3FCDB7; --mil:#E37BB5; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation}
  body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  #app{height:100%;display:flex;flex-direction:column}
  .views{flex:1;position:relative;min-height:0}
  .view{position:absolute;inset:0;display:none}
  .view.active{display:block}
  #map{position:absolute;inset:0;background:var(--bg);z-index:0;isolation:isolate}  /* слои карты остаются внутри и не закрывают фильтры */

  /* нижнее меню */
  .tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}
  .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:600;line-height:17px;text-align:center;padding:0 4px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* фильтры */
  .filters{display:flex;flex-direction:column;gap:6px}
  .frow{display:flex;gap:6px;align-items:center;min-width:0}
  .fbtn{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;cursor:pointer}
  .fbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .fbtn[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-weight:500;font-size:13px}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .chip small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="false"]{background:transparent;color:var(--muted)}
  .chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
  .fx{display:flex;gap:6px;flex-wrap:wrap}
  .zoomctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:700;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .zoomctl[hidden]{display:none}
  .zoomctl button{width:44px;height:44px;border:0;background:none;color:var(--fg);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  .zoomctl button+button{border-top:1px solid var(--line)}
  .zoomctl button:active{background:var(--chip)}
  .fx[hidden]{display:none}
  /* кнопка «свернуть панель фильтров» (только на карте) */
  .fhandle{display:none;position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);height:28px;min-width:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;cursor:pointer;z-index:2}
  .fhandle::after{content:"";position:absolute;inset:-8px -14px}
  .fhandle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .fhandle .fl{display:none}
  #view-map .fhandle{display:flex}
  #view-map .filters.collapsed{left:50%;right:auto;transform:translateX(-50%);background:none;border:0;padding:0}
  .filters.collapsed .frow,.filters.collapsed .fx{display:none!important}
  .filters.collapsed .fhandle{position:static;transform:none;height:34px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .filters.collapsed .fhandle svg{transform:rotate(180deg)}
  .filters.collapsed .fhandle .fl{display:inline}
  #q{flex:1 1 100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px}
  .more{display:block;width:100%;max-width:640px;margin:0 0 12px}
  #subnote{font-size:12px;color:var(--accent);min-height:0}
  select{flex:1 1 0;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:13px}
  #view-map .filters{position:absolute;top:calc(8px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}

  /* ленты */
  .scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px))}
  #view-feed .filters{position:sticky;top:-10px;z-index:5;margin:-10px -2px 10px;padding:10px 2px 8px;background:var(--bg)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;max-width:640px}
  .pic{position:relative;aspect-ratio:16/9;background:var(--chip);overflow:hidden}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .credit{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px}
  .cbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c)}
  .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
  .card h3{margin:0;font-size:15px;line-height:1.3;text-wrap:balance}
  .card p{margin:0;color:var(--muted)}
  .place{font-size:12px;color:var(--muted)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:13px;font-weight:500;text-decoration:none;color:var(--fg);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .empty{padding:24px 8px;color:var(--muted);text-align:center}

  /* карточка на карте */
  #sheet{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;z-index:900;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(8,16,24,.28);display:flex;gap:10px;padding:10px}
  #sheet[hidden]{display:none}
  #sheet .thumb{flex:0 0 88px;height:88px;border-radius:10px;overflow:hidden;background:var(--chip)}
  #sheet .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  #sheet .txt{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
  #sheet h3{margin:0;font-size:14px;line-height:1.3;padding-right:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #sheet .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:20px;cursor:pointer}

  /* уведомления */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;max-width:640px;display:flex;flex-direction:column;gap:10px}
  .panel h2{margin:0;font-size:16px}
  .panel p{margin:0;color:var(--muted)}
  .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .nrow{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
  .nrow .d{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
  .nrow b{display:block;font-weight:500}
  .nrow small{color:var(--muted)}

  .pin{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .pin.approx{border-style:dashed}
  .clus{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:2px solid #fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .leaflet-container{font:inherit;background:var(--bg);-webkit-tap-highlight-color:transparent}
  .leaflet-control-attribution{font-size:10px}
  .nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 24px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div class="views">
    <section class="view active" id="view-map" aria-label="Карта">
      <div id="map"></div>
      <div id="zoomctl" class="zoomctl" hidden>
        <button type="button" id="zin" aria-label="Приблизить">+</button>
        <button type="button" id="zout" aria-label="Отдалить">−</button>
      </div>
      <div id="sheet" hidden></div>
    </section>
    <section class="view" id="view-feed" aria-label="Лента"><div class="scroll" id="feedscroll"><div id="feedlist"></div></div></section>
    <section class="view" id="view-notify" aria-label="Уведомления"><div class="scroll" id="notifyscroll"></div></section>
    <div class="filters" id="filters">
      <div class="frow">
        <button class="fbtn" id="fbtn" type="button" aria-label="Период и регион" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        </button>
        <div class="chips" id="chips"></div>
      </div>
      <div class="fx" id="fx" hidden>
        <button class="chip" id="darkbtn" type="button" aria-pressed="true" style="--c:var(--muted)">🌙 Тёмная карта</button>
        <input id="q" type="search" placeholder="Поиск: город, улица, слово" aria-label="Поиск" autocomplete="off">
        <select id="period" aria-label="Период">
          <option value="1">За 24 часа</option>
          <option value="3">За 3 дня</option>
          <option value="5" selected>За 5 дней</option>
        </select>
        <select id="region" aria-label="Регион"><option value="">Вся Россия</option></select>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="map" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v13"/></svg>Карта
    </button>
    <button class="tab" role="tab" data-tab="feed" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Лента
    </button>
    <button class="tab" role="tab" data-tab="notify" aria-selected="false" id="tabnotify">
      <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Уведомления
      <span class="badge" id="badge" hidden></span>
    </button>
  </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
  ["gesturestart","gesturechange","gestureend"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand();
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e){}
    function goFull(){ try { if (tg.requestFullscreen && !tg.isFullscreen && !/^(tdesktop|macos|weba|webk|unknown)$/.test(tg.platform||"")) tg.requestFullscreen(); } catch(e){} }
    goFull(); setTimeout(goFull,400); setTimeout(goFull,1500);
    try { tg.onEvent("fullscreenFailed", function(e){ console.log("fullscreenFailed", e && e.error); }); } catch(e){}
    try { if (tg.lockOrientation) tg.lockOrientation(); } catch(e){} if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme);
    if (tg.onEvent) tg.onEvent("themeChanged", function(){ if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme); if (window.__applyMapTheme) window.__applyMapTheme(); }); }

  var BOT = "NewsRussiaMapBot";
  var DATA = __DATA__;
  DATA.sort(function(a,b){return b.ts-a.ts;});

  var TYPES = {
    dtp:{e:"🚗",name:"ДТП",c:"var(--dtp)"}, fire:{e:"🔥",name:"Пожары",c:"var(--fire)"}, wx:{e:"⚡",name:"ЧС и погода",c:"var(--wx)"},
    crime:{e:"⛔",name:"Правонарушения",c:"var(--crime)"}, tech:{e:"🆘",name:"Аварии и ЧП",c:"var(--tech)"}, mil:{e:"🪖",name:"Атаки и обстрелы",c:"var(--mil)"}
  };
  var $ = function(id){return document.getElementById(id);};
  function crc32(str){
    var b=new TextEncoder().encode(str), c=-1>>>0;
    for(var i=0;i<b.length;i++){c=(c^b[i])>>>0; for(var k=0;k<8;k++){c=(c>>>1)^(0xEDB88320&-(c&1)); c=c>>>0;}}
    return ((c^0xFFFFFFFF)>>>0).toString(16);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#";}
  function ago(ts){var m=Math.round((Date.now()/1000-ts)/60); if(m<60)return Math.max(m,1)+" мин назад"; var h=Math.round(m/60); return h<24?h+" ч назад":Math.round(h/24)+" дн. назад";}
  function when(i){return i.tsNote||new Date(i.ts*1000).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

  var on = {}; Object.keys(TYPES).forEach(function(k){on[k]=true;});
  var byId = {}; DATA.forEach(function(i,n){i.id="i"+n; byId[i.id]=i;});

  /* ссылки открываются средствами Telegram, если он есть */
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[data-ext]");
    if(a&&tg&&tg.openLink){e.preventDefault();tg.openLink(a.href);}
  });
  /* если картинка не загрузилась, убираем блок с ней */
  document.addEventListener("error",function(e){
    var t=e.target; if(t&&t.tagName==="IMG"&&t.dataset.pic){var box=t.closest(".pic,.thumb"); if(box)box.remove();}
  },true);

  /* карта */
  var BUILD = "__BUILD__";  /* время сборки страницы: видно во вкладке «Уведомления», помогает понять, не показывает ли Telegram старую версию */
  var eng = null, lastList = [];   /* eng: движок карты (Leaflet: лёгкая растровая карта) */
  var darkMapPref = store("nm_darkmap")!=="0";
  function noMap(msg){var d=document.createElement("div"); d.className="nomap"; d.textContent=msg+" (сборка: "+BUILD+")"; $("map").appendChild(d);}
  function isDark(){
    if(!darkMapPref)return false;
    var t=document.documentElement.getAttribute("data-theme");
    if(t)return t==="dark";
    return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function applyMapTheme(){ if(eng){try{eng.theme();}catch(e){}} }
  window.__applyMapTheme=applyMapTheme;
  /* Подмосковье (Московская область): на карте только события с точным адресом (улица и дом), остальные - только в ленте.
     Москва и остальные регионы показываются как раньше (неточные пины помечены пунктиром). */
  function isExact(i){ return !!i.precise && /\d/.test(i.place||""); }
  function onMap(i){ if(i.nomap) return false; return (i.region||"")==="Московская область" ? isExact(i) : true; }
  function goTo(i){ if(eng){try{eng.goTo(i);}catch(e){}} }

  function makeLeaflet(){
    var map=L.map("map",{zoomControl:false,doubleClickZoom:false,minZoom:2,maxZoom:18,worldCopyJump:false,preferCanvas:true,markerZoomAnimation:false,fadeAnimation:false,zoomSnap:1});
    /* зум одним пальцем, как в Яндекс Картах: двойной тап и, не отпуская, вести вверх/вниз */
    (function(){
      var el=map.getContainer(), last=0, lx=0, ly=0, on=false, sy=0, sz=0, pt=null, STEP=55;
      el.addEventListener("touchstart",function(e){
        if(e.touches.length!==1){ on=false; return; }
        var t=e.touches[0], now=Date.now();
        var skip=e.target.closest&&e.target.closest(".leaflet-marker-icon,.leaflet-control,.zoomctl,.filters,#sheet,a,button");
        if(!skip && now-last<320 && Math.abs(t.clientX-lx)<40 && Math.abs(t.clientY-ly)<40){
          on=true; sy=t.clientY; sz=map.getZoom(); pt=map.mouseEventToContainerPoint({clientX:t.clientX,clientY:t.clientY});
          map.dragging.disable(); e.preventDefault(); e.stopImmediatePropagation(); last=0; return;
        }
        last=now; lx=t.clientX; ly=t.clientY;
      },{passive:false,capture:true});
      el.addEventListener("touchmove",function(e){
        if(!on) return;
        e.preventDefault(); e.stopImmediatePropagation();
        var z=Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),sz+Math.round((e.touches[0].clientY-sy)/STEP)));
        if(z!==map.getZoom()) map.setZoomAround(pt,z,{animate:false});
      },{passive:false,capture:true});
      function end(){ if(on){ on=false; map.dragging.enable(); } }
      el.addEventListener("touchend",end,true); el.addEventListener("touchcancel",end,true);
    })();
    map.attributionControl.setPrefix(false); map.attributionControl.setPosition("bottomleft");
    map.fitBounds([[42,27],[68,170]],{animate:false});

    /* плитки: OpenStreetMap (бесплатно, без ключа); тёмная тема - CSS-фильтром на слое плиток */
    var tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap",updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1}).addTo(map);
    function setTiles(){
      var el=tiles.getContainer&&tiles.getContainer();
      if(el)el.style.filter=isDark()?"invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.7)":"";
    }
    tiles.on("add",setTiles);
    setTiles();

    var cluster=L.markerClusterGroup({
      showCoverageOnHover:false,disableClusteringAtZoom:1,maxClusterRadius:55,animate:false,animateAddingMarkers:false,chunkedLoading:true,removeOutsideVisibleBounds:true,
      iconCreateFunction:function(c){return L.divIcon({html:'<div class="clus">'+c.getChildCount()+'</div>',className:"",iconSize:[36,36]});}
    });
    map.addLayer(cluster);
    map.on("click",hideSheet);

    return {
      name:"leaflet",
      setPins:function(list){
        cluster.clearLayers();
        /* события в одной точке (центр города) раскладываем по спирали, чтобы метки не лежали друг на друге */
        var seen={}, pos={};
        list.forEach(function(i){
          var key=i.lat.toFixed(3)+","+i.lon.toFixed(3), k=seen[key]||0; seen[key]=k+1;
          if(!k){pos[i.id]=[i.lat,i.lon];return;}
          var ang=k*2.4, r=0.011*Math.sqrt(k), cl=Math.max(Math.cos(i.lat*Math.PI/180),0.2);
          pos[i.id]=[i.lat+r*Math.sin(ang), i.lon+r*Math.cos(ang)/cl];
        });
        cluster.addLayers(list.map(function(i){
          var t=TYPES[i.type]||TYPES.tech;
          var icon=L.divIcon({className:"",html:'<div class="pin'+(i.precise?"":" approx")+'" style="--c:'+t.c+'">'+t.e+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
          var m=L.marker(pos[i.id],{icon:icon,keyboard:false,riseOnHover:false});
          m.on("click",function(){showSheet(i,true);});
          return m;
        }));
      },
      fit:function(list){
        if(!list.length)return;
        map.fitBounds(L.latLngBounds(list.map(function(i){return [i.lat,i.lon];})),{maxZoom:9,padding:[50,50],animate:false});
      },
      goTo:function(i){map.setView([i.lat,i.lon],Math.max(map.getZoom(),9),{animate:true,duration:.3});},
      pan:function(i){var p=map.latLngToContainerPoint([i.lat,i.lon]), h=map.getSize().y; if(p.y>h-210)map.panBy([0,p.y-(h-250)]);},
      theme:function(){setTiles();},
      zoom:function(d){if(d>0)map.zoomIn();else map.zoomOut();},
      resize:function(){map.invalidateSize();}
    };
  }

  function loadMap(){
    if(typeof L==="undefined"||!L.markerClusterGroup){noMap("Не удалось загрузить карту. Проверьте интернет. Лента и уведомления работают.");return;}
    try{eng=makeLeaflet();}catch(e){eng=null; noMap("Карта не запустилась. Лента и уведомления работают.");return;}
    try{eng.setPins(lastList.slice(0,400));}catch(e){}
    applyMapTheme(); render(true);
    $("zoomctl").hidden=false;
    $("zin").onclick=function(){try{eng.zoom(1);}catch(e){}};
    $("zout").onclick=function(){try{eng.zoom(-1);}catch(e){}};
  }

  /* фильтры */
  var fh=document.createElement("button"); fh.id="fhandle"; fh.className="fhandle"; fh.type="button";
  fh.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><span class="fl">Фильтры</span>';
  $("filters").appendChild(fh);
  var fHidden = store("nm_fhidden")==="1";
  function applyFHidden(){
    var c = fHidden && tab==="map";
    $("filters").classList.toggle("collapsed",c);
    fh.setAttribute("aria-label",c?"Показать фильтры":"Скрыть панель фильтров");
    fh.setAttribute("aria-expanded",String(!c));
  }
  fh.onclick=function(){fHidden=!fHidden; store("nm_fhidden",fHidden?"1":"0"); applyFHidden();};
  var chips=$("chips");
  Object.keys(TYPES).forEach(function(k){
    var b=document.createElement("button"); b.className="chip"; b.type="button"; b.id="chip-"+k; b.setAttribute("aria-pressed","true"); b.style.setProperty("--c",TYPES[k].c);
    b.innerHTML='<i></i>'+TYPES[k].e+' '+esc(TYPES[k].name)+' <small id="n-'+k+'"></small>';
    b.onclick=function(){on[k]=!on[k]; b.setAttribute("aria-pressed",on[k]); feedLimit=60; render();};
    chips.appendChild(b);
  });
  var regions={}; DATA.forEach(function(i){regions[i.region]=1;});
  var regionList=Object.keys(regions).sort(function(a,b){return a.localeCompare(b,"ru");});
  regionList.forEach(function(r){var o=document.createElement("option");o.value=r;o.textContent=r;$("region").appendChild(o);});
  $("fbtn").onclick=function(){var h=$("fx").hidden; $("fx").hidden=!h; this.setAttribute("aria-expanded",h);};
  var feedLimit=60;
  $("darkbtn").setAttribute("aria-pressed",darkMapPref);
  $("darkbtn").onclick=function(){darkMapPref=!darkMapPref; this.setAttribute("aria-pressed",darkMapPref); store("nm_darkmap",darkMapPref?"1":"0"); applyMapTheme();};
  $("period").onchange=function(){feedLimit=60;render();};
  $("region").onchange=function(){feedLimit=60;render(true);};
  var qTimer=null;
  $("q").oninput=function(){clearTimeout(qTimer);qTimer=setTimeout(function(){feedLimit=60;render();},180);};

  function visible(ignoreTypes){
    var lim=Date.now()/1000-(+$("period").value)*86400, reg=$("region").value, q=($("q").value||"").trim().toLowerCase();
    return DATA.filter(function(i){
      if(i.ts<lim||(reg&&i.region!==reg)||!(ignoreTypes||on[i.type]))return false;
      return !q||((i.title||"")+" "+(i.place||"")+" "+(i.region||"")+" "+(i.summary||"")).toLowerCase().indexOf(q)>=0;
    });
  }
  function tag(i){var t=TYPES[i.type]||TYPES.tech; return '<span class="tag" style="--c:'+t.c+'">'+t.e+' '+esc(t.name)+'</span>';}
  function credit(i){return '<span class="credit">Фото: '+esc(i.source)+'</span>';}
  function picHtml(i){return i.img&&/^https:\/\//.test(i.img)?'<div class="pic"><img data-pic="1" loading="lazy" referrerpolicy="no-referrer" alt="" src="'+esc(i.img)+'">'+credit(i)+'</div>':'';}

  function render(zoom){
    var all=visible(true), counts={}; all.forEach(function(i){counts[i.type]=(counts[i.type]||0)+1;});
    Object.keys(TYPES).forEach(function(k){$("n-"+k).textContent=counts[k]||0;});
    var list=all.filter(function(i){return on[i.type];});

    var mapList=list.filter(onMap);
    lastList=mapList;
    if(eng){try{eng.setPins(mapList.slice(0,400)); if(zoom)eng.fit(mapList);}catch(e){}}

    var box=$("feedlist"); box.textContent="";
    if(!list.length){box.innerHTML='<div class="empty">По выбранным фильтрам происшествий нет.</div>';}
    list.slice(0,feedLimit).forEach(function(i){
      var c=document.createElement("article"); c.className="card";
      c.innerHTML=picHtml(i)+'<div class="cbody"><div class="meta">'+tag(i)+'<span>'+esc(when(i))+'</span></div>'+
        '<h3>'+esc(i.title)+'</h3><p>'+esc(i.summary)+'</p><div class="place">'+esc(i.place)+(i.region==="За рубежом"?"":', '+esc(i.region))+'</div>'+
        '<div class="acts">'+(onMap(i)?'<button class="btn primary" type="button" data-show="'+i.id+'">Показать на карте</button>':'')+
        '<a class="btn" data-ext="1" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(i.url))+'">'+esc(i.source)+' ↗</a></div></div>';
      box.appendChild(c);
    });
    if(list.length>feedLimit){
      var mb=document.createElement("button"); mb.type="button"; mb.className="btn more"; mb.textContent="Показать ещё ("+(list.length-feedLimit)+")";
      mb.onclick=function(){feedLimit+=60; var y=$("feedscroll").scrollTop; render(); $("feedscroll").scrollTop=y;};
      box.appendChild(mb);
    }
    if(sheetId&&!byId[sheetId]) hideSheet();
    badge();
  }
  $("feedlist").addEventListener("click",function(e){
    var b=e.target.closest("[data-show]"); if(!b)return;
    var i=byId[b.getAttribute("data-show")]; if(!onMap(i)){setTab("feed");return;} setTab("map");
    setTimeout(function(){goTo(i);showSheet(i,false);},60);
  });

  /* карточка на карте */
  var sheetId=null;
  function showSheet(i,pan){
    sheetId=i.id; var s=$("sheet");
    s.innerHTML=(i.img&&/^https:\/\//.test(i.img)?'<div class="thumb"><img data-pic="1" referrerpolicy="no-referrer" alt="" src="'+esc(i.img)+'"></div>':'')+
      '<div class="txt">'+tag(i)+'<h3>'+esc(i.title)+'</h3><div class="place">'+esc(i.place)+' · '+esc(when(i))+'</div>'+
      '<div class="acts"><a class="btn" data-ext="1" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(i.url))+'">'+esc(i.source)+' ↗</a></div></div>'+
      '<button class="x" type="button" aria-label="Закрыть" id="sx">×</button>';
    s.hidden=false; $("sx").onclick=hideSheet;
    if(pan&&eng){try{eng.pan(i);}catch(e){}}
  }
  function hideSheet(){sheetId=null;$("sheet").hidden=true;}

  /* уведомления */
  var sub={region:store("nm_region")||"",types:{}};
  try{sub.types=JSON.parse(store("nm_types")||"{}");}catch(e){sub.types={};}
  Object.keys(TYPES).forEach(function(k){if(sub.types[k]===undefined)sub.types[k]=true;});
  var lastSeen=+store("nm_seen")||0;
  function matches(i){return (!sub.region||i.region===sub.region)&&sub.types[i.type];}
  function fresh(){var since=lastSeen||Date.now()/1000-86400; return DATA.filter(function(i){return i.ts>since&&matches(i);});}
  function badge(){var n=tab==="notify"?0:fresh().length, b=$("badge"); b.hidden=!n; b.textContent=n>9?"9+":n;}

  function renderNotify(){
    var box=$("notifyscroll"), items=fresh();
    box.innerHTML=
      '<div class="panel"><h2>Уведомления о новых происшествиях</h2>'+
      '<p>Выберите регион и типы событий, затем подпишитесь в чате с ботом: он будет присылать новые происшествия сообщениями.</p>'+
      '<div class="lab">Регион</div><select id="subRegion" aria-label="Регион для уведомлений"><option value="">Вся Россия</option>'+
      regionList.map(function(r){return '<option value="'+esc(r)+'"'+(r===sub.region?" selected":"")+'>'+esc(r)+'</option>';}).join("")+'</select>'+
      '<div class="lab">Что интересует</div><div class="chips" id="subTypes" style="flex-wrap:wrap;overflow:visible"></div>'+
      '<button class="btn primary" type="button" id="subgo">Подписаться в Telegram</button><div id="subnote" role="status"></div>'+
      '<p style="font-size:12px">Нажмите «Start» в чате с ботом. Подтверждение придёт в течение 10–15 минут, дальше бот присылает до 5 новых происшествий за раз. Отписаться: команда /stop в чате с ботом. Канал с новостями: <a data-ext="1" target="_blank" rel="noopener noreferrer" href="https://t.me/nrmpnews" style="color:var(--accent)">t.me/nrmpnews</a></p></div>'+
      '<div class="panel"><h2>Новое с вашего прошлого визита</h2><div id="newlist"></div>'+
      '<p style="font-size:11px;opacity:.7">Версия страницы: '+esc(BUILD)+'</p></div>';
    var st=$("subTypes");
    Object.keys(TYPES).forEach(function(k){
      var b=document.createElement("button"); b.className="chip"; b.type="button"; b.style.setProperty("--c",TYPES[k].c); b.setAttribute("aria-pressed",!!sub.types[k]);
      b.innerHTML='<i></i>'+TYPES[k].e+' '+esc(TYPES[k].name);
      b.onclick=function(){sub.types[k]=!sub.types[k]; b.setAttribute("aria-pressed",!!sub.types[k]); store("nm_types",JSON.stringify(sub.types)); fillNew();};
      st.appendChild(b);
    });
    $("subRegion").onchange=function(){sub.region=this.value; store("nm_region",sub.region); fillNew();};
    $("subgo").onclick=function(){
      var mask=0; Object.keys(TYPES).forEach(function(k,n){if(sub.types[k])mask|=1<<n;});
      if(!mask){$("subnote").textContent="Выберите хотя бы один тип событий.";return;}
      $("subnote").textContent="";
      var link="https://t.me/"+BOT+"?start=n"+mask+"_"+(sub.region?crc32(sub.region):"0");
      if(tg&&tg.openTelegramLink)tg.openTelegramLink(link); else window.open(link,"_blank");
    };
    fillNew(items);
  }
  function fillNew(items){
    items=items||fresh(); var box=$("newlist"); if(!box)return;
    if(!items.length){box.innerHTML='<p>Новых происшествий нет.</p>';return;}
    box.innerHTML=items.slice(0,30).map(function(i){var t=TYPES[i.type]||TYPES.tech;
      return '<button class="nrow" type="button" data-show="'+i.id+'" style="--c:'+t.c+'"><span class="d"></span><span><b>'+esc(i.title)+'</b><small>'+esc(i.place)+' · '+esc(ago(i.ts))+'</small></span></button>';}).join("");
  }
  $("notifyscroll").addEventListener("click",function(e){
    var b=e.target.closest("[data-show]"); if(!b)return;
    var i=byId[b.getAttribute("data-show")]; if(!onMap(i)){setTab("feed");return;} setTab("map");
    setTimeout(function(){goTo(i);showSheet(i,false);},60);
  });

  /* вкладки */
  var tab="map";
  function setTab(t){
    tab=t;
    document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===t);});
    ["map","feed","notify"].forEach(function(n){$("view-"+n).classList.toggle("active",n===t);});
    var f=$("filters");
    if(t==="map")$("view-map").appendChild(f);
    else if(t==="feed"){var sc=$("feedscroll"); sc.insertBefore(f,sc.firstChild);}
    f.style.display=t==="notify"?"none":"";
    applyFHidden();
    if(t==="map")setTimeout(function(){if(eng&&eng.resize){try{eng.resize();}catch(e){}}},30);
    if(t==="notify"){renderNotify(); lastSeen=Math.floor(Date.now()/1000); store("nm_seen",String(lastSeen));}
    badge();
  }
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.tab);};});
  window.addEventListener("resize",function(){if(eng&&eng.resize){try{eng.resize();}catch(e){}}});

  $("view-map").appendChild($("filters"));
  render(); setTab("map");
  loadMap();

  /* ссылка на конкретную новость: ?p=<crc32 ссылки на источник> (на сайте) или startapp=<тот же код> (в мини-приложении) */
  (function(){
    var p=""; try{p=new URLSearchParams(location.search).get("p")||"";}catch(e){}
    if(!p&&tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)p=String(tg.initDataUnsafe.start_param);
    if(!/^[0-9a-f]{1,8}$/.test(p))return;
    var hit=null; for(var n=0;n<DATA.length;n++){ if(crc32(DATA[n].url||"")===p){hit=DATA[n];break;} }
    if(!hit)return;
    if(!onMap(hit)){setTab("feed");return;}
    setTimeout(function(){goTo(hit);showSheet(hit,false);},250);
  })();
})();
</script>
</body>
</html>
